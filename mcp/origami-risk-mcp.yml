notes: No official hosted or local Origami Risk MCP server was found — nothing on the developer portal,
  the marketing site, npm, PyPI, the (empty) github.com/origamirisk organisation or the public MCP registries.
  The tool list below is a CANDIDATE derived from operations Origami genuinely documents; every source_operation
  is a real, published endpoint. Input schemas would have to be read from the tenant's own metadata surface,
  because the published OpenAPI covers only 11 of roughly 180 documented operations.
server:
  name: origami-risk
  transport: http
  url: null
  auth:
    scheme: Token header (see authentication/origami-risk-authentication.yml)
    note: Any MCP server for Origami is inherently per-tenant — the base URL itself carries the environment
      ({environment}.origamirisk.com) and credentials are provisioned per account/client/user.
