agent_safety_notes:
- Write-side tools here move money and issue insurance contracts (bind, accept, endorse, cancel, make
  payment). No idempotency-key contract exists, so retries are not safe by default — see conventions/origami-risk-conventions.yml.
- 'A 200 response does not always mean success: proposal creation can return validation errors and rating
  can return RatingStatus "E" on a 200. Any agent must read the body.'
- fireEvents=false suppresses downstream Origami workflow events on domain writes; use it deliberately
  when loading data rather than transacting.
