      quality: scaffold — a single untouched "New Endpoint" placeholder; declares
        the same internal http://origamirater-standard.dev.dais.com server.
  acord:
    posture: no ACORD reference found; only a state EDI report action (EDIReport)
    searchedFor:
    - ACORD
    - AL3
    - ACORD XML
    - NGDS
    - ACORD certified
    - IVANS
    - agency download
    - Applied Epic
    - Vertafore
    - AMS360
    foundInDeveloperPortal:
    - term: EDIReport
      occurrences: 2
      note: A queued platform action, POST /api/v2/actions/queue/EDIReport/{domain}/{id},
        consistent with US state workers' compensation EDI reporting. Not ACORD.
    foundOnMarketingSite: []
    note: Origami Risk's integration marketing names REST API, web services,
      pre-built integrations and Databricks Delta Sharing. It makes no ACORD, AL3,
      NGDS or IVANS conformance claim anywhere that was probed. For a US P&C core
      system this is a meaningful absence — the sector's default data idiom is not
      what this vendor markets on.
  insuranceVerbs:
    quote:
      exposed: true
      audience: tenant/partner
      endpoints:
      - POST /api/quotes/proposals
      - POST /api/quotes/proposals/{proposalId}/rating/run
      - POST /api/quotes/proposals/{proposalId}/rating/queue
      - GET /api/quotes/proposals/{proposalId}/rating/status
    bind:
      exposed: true
      audience: tenant/partner
      endpoints:
      - POST /api/quotes/proposals/{proposalId}/bindquote
      - POST /api/quotes/proposals/{proposalId}/queuebindquote
      - GET /api/quotes/proposals/{proposalId}/bindstatus
    issue:
      exposed: true
      audience: tenant/partner
      endpoints:
      - POST /api/policies/{proposalId}/accept
      - POST /api/policies/{proposalId}/reject
      - POST /api/policies/{policyId}/endorse
      - POST /api/policies/{policyId}/cancel
      - POST /api/policies/{policyId}/reinstate
    fnol:
      exposed: true
      audience: tenant/partner
      endpoints:
      - POST /api/v1/actions/createclaimfromincident/{incidentId}
      - POST /api/v2/actions/queue/FirstReport/{domain}/{id}
    note: None of these are consumer-facing. Every verb is reachable only from within
      a provisioned Origami tenant, which is the normal shape for a core-systems
      vendor rather than for an embedded-insurance API.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://{environment}.origamirisk.com/OrigamiApi
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://{environment}.origamirisk.com/OrigamiApi-v2
    documented: true
    note: v2 surface, carries the Authentication and queued-action endpoints.
  - protocol: Webhooks
    scheme: https
    documented: true
    note: Handler discovery (GET /api/webhook/getHandlers), sample payload retrieval
      (GET /api/webhook/{name}/getSample) and POST /api/webhook/{name}. Plus a One
      Inc payment webhook surface. No AsyncAPI document published.
  - protocol: GraphQL
    documented: false
    note: The developer portal's own module configuration reports graphql=false. No
      GraphQL endpoint was found.
  - protocol: gRPC
    documented: false
    note: No .proto artifacts published.
  - protocol: EDI
    documented: partial
    note: An EDIReport queued action exists in the API but no EDI transport, ACORD
      AL3 mapping or IVANS connection is documented publicly.
  auth:
    model: API token (provisioned account) with optional HMAC request signing
    schemes:
    - name: Simple token
      note: POST an Account/User/Password/ClientName JSON payload to obtain a token.
    - name: OAuth-format token
      note: OAuth-style client_credentials request using a combined Client_ID and
        Client_Secret. Documented as a token format, not a full OAuth 2.0 authorization
        server.
    - name: HMAC authorization
      note: Per-call one-way dynamically changing signature; documented as higher
        overhead but additional security.
    - name: ApiKeyAuth
      note: Declared in the harvested specs as an apiKey scheme in the "Token" header.
    oidcDiscovery: false
    selfServeCredentials: false
    note: Reading the docs is self-serve. Getting a working credential is not — it
      requires a provisioned Origami Risk account and environment.
  postman:
    published: false
    note: The portal's integration configuration reports the Postman integration as
      not connected. No public Postman workspace or collection was found.
  sdks:
    published: false
    note: No first-party SDK, CLI or client library was found on the portal or on a
      public package registry under an Origami Risk namespace.
  gated: false
  gatedNote: The documentation is open. The runtime is commercial and per-tenant,
    which is a pricing gate rather than a documentation gate.
sources:
- url: https://developers.origamirisk.com/
  type: DeveloperPortal
  note: Public landing page. Navigation to Guides (/docs), API Reference (/reference)
    and a Beta Notification page.
- url: https://developers.origamirisk.com/reference
  type: APIReference
  note: Full public reference navigation covering Actions, API Availability Ping,
    Authentication Methods, Account Information, Billing Accounts, Domains and
    Entities, Files, Links, Mail Merge, Metadata for Forms and Fields, Migrations,
    Silent Migration, Online Policy Payment, Policies, Quotes and Proposals, Reports,
    Webhooks and Webservices.
- url: https://developers.origamirisk.com/reference/authentication-methods
  type: Authentication
  note: Documents simple token format, OAuth token format and HMAC authorization.
- url: https://developers.origamirisk.com/docs
  type: Documentation
  note: Five guides only — getting-started, setting-the-environment,
    max-url-limits-on-get-requests, max-request-payload-size-for-any-api-request,
    beta-notification.
- url: https://www.origamirisk.com/platform/api-access/
  type: ProductOverview
  note: '"Connect systems seamlessly with REST API and web services for risk and
    insurance data integration" plus Databricks Delta Sharing. No ACORD, AL3, IVANS,
    Applied Epic or Vertafore mention.'
- url: https://www.origamirisk.com/solutions/insurance/
  type: Website
  note: Names policy administration, billing, claims administration, and the
    workers' compensation, medical professional liability, personal auto and
    homeowners lines for carriers, MGAs, TPAs and risk pools. No ACORD or EDI
    mention.
- url: https://www.origamirisk.com/products/policy-administration
  type: Website
  note: Full policy lifecycle from a single system — digital underwriting, rating,
    billing, premium audit, claims, analytics, portals and document generation.
actions:
  apisYmlCreated: true
  openapiHarvested: 4
  asyncapiCreated: false
  reason: |
    Nine API entries were recorded against the real, publicly documented reference
    categories, with OpenAPI pointers attached only where a harvested specification
    genuinely corresponds. No AsyncAPI was authored: webhooks exist but Origami Risk
    publishes no event catalog or channel list, and inventing one would be
    fabrication. The Quotes and Proposals, Policies, Billing, Actions, Webhooks and
    Reports entries carry documentation and reference properties only, because those
    surfaces are documented as hand-authored ReadMe pages with no corresponding
    machine-readable definition.
