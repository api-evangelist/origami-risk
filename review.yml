aid: origami-risk
name: Origami Risk
review:
  question: Does Origami Risk publish a real, public, self-serve developer portal and
    downloadable API specifications for its US property and casualty core insurance
    platform?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: core-systems
findings:
  summary: |
    Origami Risk is one of the exceptions in the US insurance sector. The US has no
    federal insurance regulator and no open-insurance mandate, so almost nothing in
    this market forces a public API surface — but Origami Risk sits in the software
    layer between carriers and distribution, and it does run a genuinely public
    developer portal at https://developers.origamirisk.com (HTTP 200, ReadMe-hosted,
    project privacy view=public). The reference is readable without logging in: the
    full left navigation, every endpoint page and the authentication guides render
    anonymously. A "Log In" link exists at /login?redirect_uri=/ but it gates nothing
    that was probed — this is a real self-serve developer portal, not a partner login
    wall. It is, however, explicitly in beta (a "Beta Notification" guide sits at the
    top of the guides tree) and it is thin on guides: only five docs pages exist
    (getting-started, setting-the-environment, max-url-limits-on-get-requests,
    max-request-payload-size-for-any-api-request, beta-notification) against roughly
    180 endpoint reference pages.

    Four OpenAPI definitions are registered to the portal and all four were harvested
    verbatim from ReadMe's public API registry. Only one of the four is a substantive
    specification. The portal's own project config sets openapi privacy to "admin",
    so the /branches/1.0/apis/*.json download paths do not serve anonymously; the
    specs were retrieved instead via the registry UUIDs embedded in the public page
    payload. The practical finding is that Origami Risk documents a large REST surface
    as hand-authored ReadMe pages rather than shipping a complete machine-readable
    definition — the four registered specs cover 11 paths between them while the
    reference documents on the order of 180 operations.

    On the sector-specific signal, Origami Risk makes no ACORD claim at all. Neither
    the marketing site (origamirisk.com/platform/api-access/,
    /platform/third-party-system-integrations, /solutions/insurance/) nor the developer
    portal mentions ACORD, AL3, ACORD XML, NGDS, IVANS, agency download, Applied Epic,
    Vertafore or AMS360. The only standards-shaped artifact anywhere in the API surface
    is a queued action named EDIReport (POST /api/v2/actions/queue/EDIReport/{domain}/{id}),
    which is consistent with US state workers' compensation EDI reporting rather than
    with ACORD transport. Integration marketing instead names REST API, web services,
    a "vast library of pre-built integrations", and Databricks Delta Sharing for bulk
    structured data.

    All four insurance verbs are exposed, and they are exposed as tenant/partner-facing
    operations rather than consumer-facing ones. Quote and rate: POST /api/quotes/proposals
    plus /rating/run, /rating/queue and /rating/status. Bind: /bindquote, /queuebindquote
    and /bindstatus. Issue and lifecycle: POST /api/policies/{proposalId}/accept plus
    endorse, cancel, reinstate and change-billing-frequency on the issued policy. FNOL:
    POST /api/v1/actions/createclaimfromincident/{incidentId} and the FirstReport queued
    action. Billing and payments are present including a One Inc payment gateway
    integration. Outbound webhooks exist as a handler-discovery and sample-payload
    surface, but there is no AsyncAPI document and no standalone event catalog.

    Access to a live surface remains commercial. The base URL is a per-customer
    templated host, https://{environment}.origamirisk.com/OrigamiApi and
    /OrigamiApi-v2 — there is no shared public API hostname and api.origamirisk.com
    does not resolve. Authentication is token-based against a provisioned Origami
    account in two documented formats (a simple Account/User/Password/ClientName JSON
    payload, and an OAuth-style client_credentials request using a combined Client_ID
    and Client_Secret), with HMAC authorization available as a higher-security
    per-call signing option; the harvested specs declare an apiKey security scheme
    carrying the token in a "Token" header. No OpenID Connect or OAuth authorization
    server metadata is served (both /.well-known probes returned 404). The portal
    reports no GraphQL module and no connected Postman integration.
