  specs:
    harvested: true
    count: 4
    substantive: 1
    note: Retrieved verbatim from ReadMe's public API registry using the registry
      UUIDs published in the developer portal page payload, because the portal's own
      /branches/1.0/apis/*.json download paths are admin-restricted.
    files:
    - path: openapi/origami-risk-public-api-openapi.json
      sourceFilename: origami-risk-public-api.json
      sourceURL: https://dash.readme.com/api/v1/api-registry/42jzdqmb9blt8y
      status: 200
      fetched: '2026-07-25'
      openapi: 3.0.0
      title: Origami Risk Public API
      paths: 4
      quality: scaffold — contains ReadMe API Designer placeholder operations
        ("New Endpoint", "This is your first endpoint!") alongside real
        /HasTokenExpired and /Authentication/Authenticate operations; declares the
        ApiKeyAuth "Token" header scheme and the
        https://{environment}.origamirisk.com/OrigamiApi server.
    - path: openapi/origami-risk-authentication-openapi.json
      sourceFilename: origami-risk.json
      sourceURL: https://dash.readme.com/api/v1/api-registry/42jzd1imb9b9vdt
      status: 200
      fetched: '2026-07-25'
      openapi: 3.0.0
      title: Origami Risk Authentication
      paths: 3
      quality: scaffold — real /Authentication/HasTokenExpired and
        /Authentication/Ping operations plus an Authenticate request body carrying
        Account/User/Password/ClientName, but one path is still literally named
        "Authenticate-DELETEME"; declares the
        https://{environment}.origamirisk.com/OrigamiApi-v2 server.
    - path: openapi/origami-risk-standard-rating-api-openapi.json
      sourceFilename: standardratingapi_openapi.json
      sourceURL: https://dash.readme.com/api/v1/api-registry/42jzd2dmb9egs3n
      status: 200
      fetched: '2026-07-25'
      openapi: 3.0.1
      title: Rating API
      paths: 3
      quality: substantive — POST /Requests/sync, POST /Requests/async and
        GET/DELETE /Requests/{requestId} with full StandardRatingRequestDto,
        SyncRatingResponseDto, AsyncRatingResponseDto, RatingResultDetailsDto and
        ProblemDetails schemas. Declares a non-production server
        (http://origamirater-standard.dev.dais.com?oas), which is a leaked internal
        development host rather than a customer base URL.
    - path: openapi/origami-risk-rating-api-openapi.json
      sourceFilename: rating-api.json
      sourceURL: https://dash.readme.com/api/v1/api-registry/42jzd2dmb9ehfrz
      status: 200
