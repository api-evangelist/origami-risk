  description: Billing account operations including making and reversing payments,
    plus an online policy payment surface integrated with the One Inc payment
    gateway covering payment submission, payment-method acknowledgement, autopay
    management feedback and payment feedback callbacks.
  humanURL: https://developers.origamirisk.com/reference/billing-accounts
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
