name: Origami Risk
kind: company
description: Origami Risk is a Chicago-headquartered risk, safety and insurance SaaS
  company founded in 2009 that began as a single-version cloud RMIS (risk management
  information system) and grew into a core-systems platform for the United States
  property and casualty market. It sells policy administration, digital underwriting,
  rating, billing, premium audit, claims administration, compliance and EHS/GRC modules
  to carriers, MGAs, program administrators, third-party administrators, risk pools,
  brokers, healthcare systems and large self-insureds, across workers' compensation,
  medical professional liability, personal auto and homeowners lines. Unlike most US
  insurance organizations, Origami Risk sits in the software layer between carriers
  and distribution and therefore does publish a genuinely public, self-serve developer
  portal at developers.origamirisk.com — a ReadMe-hosted reference readable without
  login, covering quote and proposal creation, rating, bind, policy issue/endorse/cancel,
  billing and payments, claims-from-incident and first-report actions, files, reports,
  domain metadata and outbound webhooks. Four OpenAPI definitions are downloadable
  from the portal's spec registry, though three of the four are thin scaffolds and
  the bulk of the reference is hand-authored per-endpoint documentation rather than
  a complete machine-readable spec. Access to a live tenant is still commercial —
  the base URL is a per-customer https://{environment}.origamirisk.com host and
  authentication is token-based or HMAC against a provisioned account — and no ACORD,
  AL3, IVANS or NGDS conformance is claimed anywhere in the marketing site or the
  developer portal.
