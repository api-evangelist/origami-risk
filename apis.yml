apis:
- aid: origami-risk:origami-risk-authentication-api
  name: Origami Risk Authentication API
  description: Token issuance and session verification for the Origami Risk platform
    APIs. Two documented token formats — a simple JSON payload (Account, User, Password,
    ClientName) and an OAuth-style client_credentials request combining Client_ID and
    Client_Secret — plus HMAC authorization for per-call signing, an availability ping,
    and a token-expiry check.
  humanURL: https://developers.origamirisk.com/reference/authentication-methods
  baseURL: https://{environment}.origamirisk.com/OrigamiApi-v2
  tags:
  - Authentication
  - OAuth
  - HMAC
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/authentication-methods
  - type: OpenAPI
    url: openapi/origami-risk-authentication-openapi.json
- aid: origami-risk:origami-risk-public-api
  name: Origami Risk Public API
  description: The core Origami Risk platform API — generic domain and entity CRUD
    (get, upsert, bulk insert, bulk upsert, delete), domain metadata and data dictionary
    lookups, screen configuration, notes, emails, files and external storage upload,
    record linking, mail merge, and query/filter syntax validation across every
    configurable Origami domain.
  humanURL: https://developers.origamirisk.com/reference/domains-entities
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
  - Domains
  - Entities
  - Metadata
  - Files
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/domains-entities
  - type: OpenAPI
    url: openapi/origami-risk-public-api-openapi.json
- aid: origami-risk:origami-risk-standard-rating-api
  name: Origami Risk Standard Rating API
  description: Standalone standard rating service that accepts a rating request
    referencing a rater and intake payloads and returns rating results, offered in
    both synchronous and asynchronous modes with request retrieval and cancellation.
    The only one of Origami's four published OpenAPI definitions that carries a
    complete set of request/response schemas.
  humanURL: https://developers.origamirisk.com/reference
  tags:
  - Rating
  - Quote
  properties:
  - type: APIReference
    url: https://developers.origamirisk.com/reference
  - type: OpenAPI
    url: openapi/origami-risk-standard-rating-api-openapi.json
  - type: OpenAPI
    url: openapi/origami-risk-rating-api-openapi.json
- aid: origami-risk:origami-risk-quotes-and-proposals-api
  name: Origami Risk Quotes and Proposals API
  description: Quote-side policy lifecycle — create and patch proposals, add and
    remove policy lines, coverages, schedules and linked schedules, list insurance
    programs, carriers, policy lines and states, run or queue rating and check rating
    status, run and waive validations, retrieve billing and endorsement billing
    options, then bind the quote synchronously or by queue and poll bind status.
  humanURL: https://developers.origamirisk.com/reference/quotes-and-proposals
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
  - Quote
  - Bind
  - Rating
  - Underwriting
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/quotes-and-proposals
- aid: origami-risk:origami-risk-policies-api
  name: Origami Risk Policies API
  description: Issue-side policy administration — accept, reject, undo-accept,
    undo-reject and undo-binding a bound proposal to issue a policy, then endorse,
    cancel, reinstate, change billing frequency and take payment against the issued
    policy, with cancellation and reinstatement reason code lookups.
  humanURL: https://developers.origamirisk.com/reference/policies
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
  - Policy Administration
  - Issue
  - Endorsement
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/policies
- aid: origami-risk:origami-risk-billing-accounts-api
  name: Origami Risk Billing and Payments API
  description: Billing account operations including making and reversing payments,
    plus an online policy payment surface integrated with the One Inc payment
    gateway covering payment submission, payment-method acknowledgement, autopay
    management feedback and payment feedback callbacks.
  humanURL: https://developers.origamirisk.com/reference/billing-accounts
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
  - Billing
  - Payments
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/billing-accounts
- aid: origami-risk:origami-risk-actions-api
  name: Origami Risk Actions API
  description: Real-time and queued platform actions triggered against any domain
    record — including creating a claim from an incident (the FNOL path), FirstReport,
    Reserve, Review, RootCause, EDIReport state reporting, AuditResponse, Abstract,
    AddressValid, AssignSurvey, CorrAction, DataUpdate, DRFScoring, Email, Fax, SMS,
    MailMerge, Note, Report, RoundRobin, SendMobileForm, StateForm, Task and User
    actions.
  humanURL: https://developers.origamirisk.com/reference/actions
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
  - Claims
  - FNOL
  - Workflow
  - EDI
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/actions
- aid: origami-risk:origami-risk-webhooks-api
  name: Origami Risk Webhooks API
  description: Outbound event delivery for the Origami Risk platform — list the
    configured webhook handlers, retrieve a sample payload for a named handler, and
    post to a named webhook. A separate One Inc webhook surface handles payment
    gateway callbacks. No AsyncAPI document or standalone event catalog is published.
  humanURL: https://developers.origamirisk.com/reference/webhooks
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
  - Webhooks
  - Events
  properties:
  - type: Documentation
    url: https://developers.origamirisk.com/docs
  - type: APIReference
    url: https://developers.origamirisk.com/reference/webhooks
- aid: origami-risk:origami-risk-reports-api
  name: Origami Risk Reports API
  description: Reporting surface for requesting a report run, retrieving report
    details and options, validating a report filter, and converting between the
    platform's view-filter string form and its JSON tree form.
  humanURL: https://developers.origamirisk.com/reference/reports
  baseURL: https://{environment}.origamirisk.com/OrigamiApi
  tags:
