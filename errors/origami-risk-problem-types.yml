gaps:
- No published platform-wide error-code registry or error reference page.
- No application/problem+json media type; RFC 9457 type URIs are not used.
- The four published OpenAPI definitions declare no 4xx responses outside the Standard
  Rating service, so most of the ~180 documented operations have no machine-readable
  error contract.
