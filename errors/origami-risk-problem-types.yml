format: mixed
description: >-
  Origami Risk does not publish a platform-wide error-code registry. Two distinct error
  shapes are observable in the public surface: the standalone Standard Rating service
  returns RFC 7807 ProblemDetails on 400/404, while the core platform API returns
  operation-specific JSON bodies and — importantly — is documented as returning HTTP 200
  for some validation and rating failures. Clients must inspect the response body, not
  only the status code.
envelope:
  rfc7807:
    used_by: openapi/origami-risk-standard-rating-api-openapi.json
    media_types:
    - application/json
    - text/json
    - text/plain
    schema: ProblemDetails
    fields:
    - {name: type, type: string, nullable: true}
    - {name: title, type: string, nullable: true}
    - {name: status, type: integer, nullable: true}
    - {name: detail, type: string, nullable: true}
    - {name: instance, type: string, nullable: true}
    note: >-
      The schema is the ASP.NET Core ProblemDetails shape (RFC 7807), not the newer
      RFC 9457 problem type registry, and no application/problem+json media type is
      declared — the same object is served as application/json.
  in_band_success_errors:
    used_by: core platform API (/OrigamiApi)
    note: >-
      Documented on multiple endpoints. POST /api/Quotes/Proposals warns of "the
      possibility of receiving a 200 response to denote validation errors".
      POST /api/Quotes/Proposals/{proposalId}/Rating/Run catches rating-engine
      exceptions internally and returns 200 OK with RatingStatus = "E" and the
      message in RatingErrorMessage.
    fields:
    - {name: RatingStatus, values: 'C = complete, E = error', source: ProposalRatingStatus}
    - {name: RatingErrorMessage, type: string}
  rating_result_errors:
    used_by: openapi/origami-risk-standard-rating-api-openapi.json
    note: >-
      Per-intake failures inside a 200 response are carried as
      RatingResultDetailsDto.errors[] (array of strings), and queueing failures as
      SyncRatingResponseDto.failedToQueueErrors (map of id -> message).
